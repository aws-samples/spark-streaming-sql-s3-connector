[pytest]
testpaths = .
markers =
    e2e: runs Spark jobs on EMR Serverless against the Terraform stack (needs --tf-dir and --connector-jar)
    pyspark: goes through the PySpark helper package (python/) via job/pyspark_job.py; run_e2e.py --suite pyspark selects these, --suite core skips them
    sqs_single_dot: uses the one-dot spark.s3conn.sqs.* keys; fails on jars without the prefix fix
addopts = -ra
